[project]
name = "tpi-ssd-backend"
version = "0.1.0"
description = "Backend del sistema de turnos y agenda odontológica"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: pruebas que requieren PostgreSQL real (TEST_DATABASE_URL)",
]
