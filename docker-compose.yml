x-backend: &backend
  build: ./backend

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turnos}
      POSTGRES_DB: ${POSTGRES_DB:-turnos}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [db_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-turnos} -d ${POSTGRES_DB:-turnos}']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: alembic upgrade head
    secrets: [database_url]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    env_file: .env
    secrets: [database_url, jwt_secret_key]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports: ['127.0.0.1:${FRONTEND_PORT:-5173}:5173']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.30.1
    profiles: [dev]
    ports: ['127.0.0.1:${MAILPIT_PORT:-8025}:8025']
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_url:
    file: ./secrets/database_url.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt

volumes:
  db_data:
