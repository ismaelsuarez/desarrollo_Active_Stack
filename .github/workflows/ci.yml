name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.30.1
        ports: [1025:1025, 8025:8025]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
      CONSULTORIO_ACTIVO_ID: 1
      SMTP_TEST_HOST: 127.0.0.1
      SMTP_TEST_PORT: 1025
      MAILPIT_API_URL: http://127.0.0.1:8025
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic heads
      - run: uv run python scripts/check_single_head.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable local configuration
        run: |
          scripts/dev_secrets.sh
          test -f .env || cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build backend
      - run: docker build --target build frontend

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/smoke_compose.sh
